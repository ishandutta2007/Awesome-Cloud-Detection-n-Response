<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1a" />
      <stop offset="50%" stop-color="#101735" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Accent Neon Gradients -->
    <linearGradient id="primaryNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF0080" />
    </linearGradient>

    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00DFD8" />
      <stop offset="100%" stop-color="#007CF0" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #00dfd8; }
    
    /* Dynamic CSS Animations */
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .animated-circle { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
    .animated-float { animation: float 6s ease-in-out infinite; }
    .animated-stream { stroke-dasharray: 8, 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="16" />

  <!-- Background Dynamic Mesh / Glow Elements (Behind Text) -->
  <circle cx="200" cy="80" r="180" fill="#7928CA" opacity="0.15" filter="url(#glow)" class="animated-circle" />
  <circle cx="1000" cy="240" r="220" fill="#007CF0" opacity="0.12" filter="url(#glow)" class="animated-circle" />

  <!-- Cyber Grid Lines & Streams -->
  <g opacity="0.25">
    <path d="M0,80 L1200,80 M0,160 L1200,160 M0,240 L1200,240" stroke="#334155" stroke-width="1" />
    <path d="M200,0 L200,320 M400,0 L400,320 M600,0 L600,320 M800,0 L800,320 M1000,0 L1000,320" stroke="#334155" stroke-width="1" />
  </g>

  <!-- Animated Data Streams -->
  <path d="M 150 260 Q 400 290 650 260 T 1100 250" fill="none" stroke="url(#cyanNeon)" stroke-width="2" class="animated-stream" filter="url(#glow)" />
  <path d="M 100 60 Q 500 20 900 60 T 1150 80" fill="none" stroke="url(#primaryNeon)" stroke-width="2" class="animated-stream" filter="url(#glow)" />

  <!-- Foreground Content Block (Text & UI Pill Badges) -->
  <g transform="translate(60, 0)">
    
    <!-- Top Decorative Pill -->
    <g transform="translate(0, 48)">
      <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="18" cy="16" r="6" fill="#00dfd8" filter="url(#glow)" />
      <text x="34" y="21" class="badge-text">CLOUD DETECTION &amp; RESPONSE</text>
    </g>

    <!-- Main Title (Guaranteed Foreground Visibility) -->
    <text x="0" y="130" class="title">Awesome Cloud Detection &amp; Response (CDR) ⚡</text>

    <!-- Subtitle -->
    <text x="0" y="170" class="subtitle">Curated SaaS Platforms &amp; Open-Source Ecosystem for Cloud Control-Plane, ITDR &amp; Runtime Security</text>

    <!-- Feature Tag Chips -->
    <g transform="translate(0, 210)" class="animated-float">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#131c38" stroke="#007CF0" stroke-width="1.5" />
      <text x="16" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#60a5fa">🛡️ Control-Plane</text>

      <!-- Tag 2 -->
      <rect x="175" y="0" width="175" height="36" rx="8" fill="#131c38" stroke="#7928CA" stroke-width="1.5" />
      <text x="191" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#c084fc">🚀 Runtime Telemetry</text>

      <!-- Tag 3 -->
      <rect x="365" y="0" width="150" height="36" rx="8" fill="#131c38" stroke="#FF0080" stroke-width="1.5" />
      <text x="381" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#f472b6">🔑 Identity / ITDR</text>

      <!-- Tag 4 -->
      <rect x="530" y="0" width="165" height="36" rx="8" fill="#131c38" stroke="#00DFD8" stroke-width="1.5" />
      <text x="546" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#2dd4bf">⚡ eBPF Enforcement</text>
    </g>
  </g>

  <!-- Right Side Graphic / Shield Icon -->
  <g transform="translate(980, 70)" class="animated-float">
    <polygon points="60,10 110,35 110,95 60,135 10,95 10,35" fill="none" stroke="url(#cyanNeon)" stroke-width="3" filter="url(#glow)" />
    <path d="M60,30 L90,48 L90,82 L60,105 L30,82 L30,48 Z" fill="url(#primaryNeon)" opacity="0.6" />
    <path d="M50,68 L58,76 L75,56" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
